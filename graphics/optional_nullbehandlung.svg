<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Optional und kontrollierte Null-Behandlung</title>
  <desc id="desc">Die Grafik vergleicht null mit Optional und zeigt den Ablauf vom Repository über Service und REST Controller zu ProduktDto oder 404-Fehlerantwort.</desc>
  <defs>
    <style>
      .bg { fill: #f7fbff; }
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #17324d; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #2b4c6f; }
      .sectionTitle { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #17324d; }
      .boxTitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #17324d; }
      .text { font-family: Arial, sans-serif; font-size: 15px; fill: #1f2d3d; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #1f2d3d; }
      .code { font-family: Courier New, monospace; font-size: 15px; fill: #17324d; }
      .note { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #7a3e00; }
      .panel { fill: #ffffff; stroke: #4e79a7; stroke-width: 2.5; }
      .panelBlue { fill: #e8f1fb; stroke: #4e79a7; stroke-width: 2.5; }
      .panelGreen { fill: #eef7ea; stroke: #6aa84f; stroke-width: 2.5; }
      .panelOrange { fill: #fff4e8; stroke: #d9903d; stroke-width: 2.5; }
      .panelRed { fill: #fff0f0; stroke: #c95454; stroke-width: 2.5; }
      .panelGrey { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.5; }
      .line { stroke: #4e79a7; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .lineGreen { stroke: #6aa84f; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .lineRed { stroke: #c95454; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .lineOrange { stroke: #d9903d; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
    </style>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4e79a7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6aa84f"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c95454"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d9903d"/>
    </marker>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="960"/>

  <text x="800" y="54" text-anchor="middle" class="title">Optional und kontrollierte Null-Behandlung</text>
  <text x="800" y="86" text-anchor="middle" class="subtitle">Fehlende Werte sichtbar modellieren statt still mit null arbeiten</text>

  <g filter="url(#shadow)">
    <rect x="80" y="140" width="390" height="300" rx="18" class="panelRed"/>
  </g>
  <text x="275" y="182" text-anchor="middle" class="sectionTitle">null</text>
  <text x="125" y="230" class="code">Produkt produkt = null;</text>
  <text x="125" y="282" class="text">Problem:</text>
  <text x="145" y="318" class="small">fehlender Wert ist im Typ unsichtbar</text>
  <text x="145" y="350" class="small">Prüfung wird leicht vergessen</text>
  <text x="145" y="382" class="small">NullPointerException möglich</text>

  <g filter="url(#shadow)">
    <rect x="80" y="520" width="390" height="300" rx="18" class="panelGreen"/>
  </g>
  <text x="275" y="562" text-anchor="middle" class="sectionTitle">Optional</text>
  <text x="125" y="610" class="code">Optional&lt;Produkt&gt;</text>
  <text x="125" y="662" class="text">Wirkung:</text>
  <text x="145" y="698" class="small">fehlender Wert ist sichtbar</text>
  <text x="145" y="730" class="small">Entscheidung wird bewusst</text>
  <text x="145" y="762" class="small">REST-Fehler kann kontrolliert entstehen</text>

  <g filter="url(#shadow)">
    <rect x="600" y="135" width="330" height="100" rx="18" class="panelBlue"/>
  </g>
  <text x="765" y="175" text-anchor="middle" class="boxTitle">Repository</text>
  <text x="765" y="208" text-anchor="middle" class="code">findeNachId(id)</text>

  <g filter="url(#shadow)">
    <rect x="600" y="300" width="330" height="100" rx="18" class="panel"/>
  </g>
  <text x="765" y="340" text-anchor="middle" class="boxTitle">Optional&lt;Produkt&gt;</text>
  <text x="765" y="373" text-anchor="middle" class="small">Produkt vorhanden oder leer</text>

  <g filter="url(#shadow)">
    <rect x="600" y="465" width="330" height="100" rx="18" class="panel"/>
  </g>
  <text x="765" y="505" text-anchor="middle" class="boxTitle">Service</text>
  <text x="765" y="538" text-anchor="middle" class="small">koordiniert fachlichen Ablauf</text>

  <g filter="url(#shadow)">
    <rect x="600" y="630" width="330" height="100" rx="18" class="panelOrange"/>
  </g>
  <text x="765" y="670" text-anchor="middle" class="boxTitle">REST Controller</text>
  <text x="765" y="703" text-anchor="middle" class="small">entscheidet über HTTP-Antwort</text>

  <path d="M765 235 C765 255, 765 280, 765 300" class="line"/>
  <path d="M765 400 C765 420, 765 445, 765 465" class="line"/>
  <path d="M765 565 C765 585, 765 610, 765 630" class="lineOrange"/>

  <g filter="url(#shadow)">
    <rect x="1070" y="285" width="390" height="145" rx="18" class="panelGreen"/>
  </g>
  <text x="1265" y="327" text-anchor="middle" class="boxTitle">Wert vorhanden</text>
  <text x="1265" y="365" text-anchor="middle" class="code">Optional.of(produkt)</text>
  <text x="1265" y="402" text-anchor="middle" class="small">200 OK + ProduktDto</text>

  <g filter="url(#shadow)">
    <rect x="1070" y="535" width="390" height="145" rx="18" class="panelRed"/>
  </g>
  <text x="1265" y="577" text-anchor="middle" class="boxTitle">Wert fehlt</text>
  <text x="1265" y="615" text-anchor="middle" class="code">Optional.empty()</text>
  <text x="1265" y="652" text-anchor="middle" class="small">404 Not Found + ErrorResponse</text>

  <path d="M930 350 C980 350, 1020 350, 1070 350" class="lineGreen"/>
  <path d="M930 680 C995 645, 1025 615, 1070 608" class="lineRed"/>

  <g filter="url(#shadow)">
    <rect x="160" y="875" width="1280" height="56" rx="18" fill="#fff6da" stroke="#d6a73b" stroke-width="2.5"/>
  </g>
  <text x="800" y="910" text-anchor="middle" class="note">Optional macht sichtbar, dass ein Repository kein Objekt finden kann.</text>
</svg>
