<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architekturvergleich JDBC und JPA Spring Data</title>
  <desc id="desc">Die Grafik vergleicht die Architektur Controller Service Repository JDBC Datenbank mit Controller Service Repository JPA Spring Data Datenbank.</desc>
  <defs>
    <style>
      .bg { fill: #f7fbff; }
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #17324d; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #2b4c6f; }
      .section { font-family: Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #17324d; }
      .boxTitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #17324d; }
      .text { font-family: Arial, sans-serif; font-size: 15px; fill: #1f2d3d; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #1f2d3d; }
      .note { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #7a3e00; }
      .panelBlue { fill: #e8f1fb; stroke: #4e79a7; stroke-width: 2.5; }
      .panelGreen { fill: #eef7ea; stroke: #6aa84f; stroke-width: 2.5; }
      .panelGrey { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.5; }
      .panelOrange { fill: #fff4e8; stroke: #d9903d; stroke-width: 2.5; }
      .panelPurple { fill: #f2ecfb; stroke: #8e6bbf; stroke-width: 2.5; }
      .db { fill: #ffffff; stroke: #4e79a7; stroke-width: 2.5; }
      .boundary { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 7; }
      .line { stroke: #4e79a7; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .lineGreen { stroke: #6aa84f; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4e79a7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6aa84f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text x="800" y="54" text-anchor="middle" class="title">JPA und Spring Data: Architektur bleibt stabil</text>
  <text x="800" y="86" text-anchor="middle" class="subtitle">Die Persistenztechnik ändert sich. Controller, Service und Repository bleiben getrennt.</text>

  <text x="800" y="140" text-anchor="middle" class="section">Mit JDBC</text>
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="1460" height="160" rx="20" class="boundary"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="115" y="220" width="190" height="78" rx="12" class="panelBlue"/>
    <rect x="365" y="220" width="190" height="78" rx="12" class="panelGreen"/>
    <rect x="615" y="220" width="190" height="78" rx="12" class="panelGrey"/>
    <rect x="865" y="220" width="190" height="78" rx="12" class="panelOrange"/>
    <rect x="1115" y="210" width="210" height="98" rx="14" class="db"/>
  </g>
  <text x="210" y="252" text-anchor="middle" class="boxTitle">Controller</text>
  <text x="210" y="278" text-anchor="middle" class="small">HTTP</text>
  <text x="460" y="252" text-anchor="middle" class="boxTitle">Service</text>
  <text x="460" y="278" text-anchor="middle" class="small">Fachlogik</text>
  <text x="710" y="252" text-anchor="middle" class="boxTitle">Repository</text>
  <text x="710" y="278" text-anchor="middle" class="small">Datenzugriff</text>
  <text x="960" y="252" text-anchor="middle" class="boxTitle">JDBC</text>
  <text x="960" y="278" text-anchor="middle" class="small">SQL und Mapping</text>
  <text x="1220" y="248" text-anchor="middle" class="boxTitle">Datenbank</text>
  <text x="1220" y="278" text-anchor="middle" class="small">H2 oder andere DB</text>
  <path d="M305 259 L365 259" class="line"/>
  <path d="M555 259 L615 259" class="line"/>
  <path d="M805 259 L865 259" class="line"/>
  <path d="M1055 259 L1115 259" class="line"/>

  <text x="800" y="430" text-anchor="middle" class="section">Mit JPA und Spring Data JPA</text>
  <g filter="url(#shadow)">
    <rect x="70" y="470" width="1460" height="180" rx="20" class="boundary"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="115" y="520" width="190" height="78" rx="12" class="panelBlue"/>
    <rect x="365" y="520" width="190" height="78" rx="12" class="panelGreen"/>
    <rect x="615" y="520" width="190" height="78" rx="12" class="panelGrey"/>
    <rect x="865" y="505" width="230" height="108" rx="14" class="panelPurple"/>
    <rect x="1160" y="510" width="210" height="98" rx="14" class="db"/>
  </g>
  <text x="210" y="552" text-anchor="middle" class="boxTitle">Controller</text>
  <text x="210" y="578" text-anchor="middle" class="small">HTTP</text>
  <text x="460" y="552" text-anchor="middle" class="boxTitle">Service</text>
  <text x="460" y="578" text-anchor="middle" class="small">Fachlogik</text>
  <text x="710" y="552" text-anchor="middle" class="boxTitle">Repository</text>
  <text x="710" y="578" text-anchor="middle" class="small">Datenzugriff</text>
  <text x="980" y="542" text-anchor="middle" class="boxTitle">Spring Data JPA / JPA</text>
  <text x="980" y="568" text-anchor="middle" class="small">Persistenz-Abstraktion</text>
  <text x="980" y="592" text-anchor="middle" class="small">Hibernate führt aus</text>
  <text x="1265" y="548" text-anchor="middle" class="boxTitle">Datenbank</text>
  <text x="1265" y="578" text-anchor="middle" class="small">H2 oder andere DB</text>
  <path d="M305 559 L365 559" class="lineGreen"/>
  <path d="M555 559 L615 559" class="lineGreen"/>
  <path d="M805 559 L865 559" class="lineGreen"/>
  <path d="M1095 559 L1160 559" class="lineGreen"/>

  <g filter="url(#shadow)">
    <rect x="210" y="755" width="1180" height="70" rx="18" fill="#fff6da" stroke="#d6a73b" stroke-width="2.5"/>
  </g>
  <text x="800" y="785" text-anchor="middle" class="note">Spring Data JPA vereinfacht die Persistenz hinter dem Repository.</text>
  <text x="800" y="812" text-anchor="middle" class="note">Die Architektur bleibt: Controller -&gt; Service -&gt; Repository.</text>
</svg>
