<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Integrationstests prüfen mehrere Schichten</title>
  <desc id="desc">Die Grafik vergleicht Unit-Tests mit Integrationstests. Unit-Tests prüfen eine einzelne Klasse. Integrationstests prüfen Controller, Validation, Service, Repository und H2 gemeinsam.</desc>
  <defs>
    <style>
      .bg { fill: #f7fbff; }
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #17324d; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #2b4c6f; }
      .section { font-family: Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #17324d; }
      .boxTitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #17324d; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #1f2d3d; }
      .note { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #7a3e00; }
      .panelBlue { fill: #e8f1fb; stroke: #4e79a7; stroke-width: 2.5; }
      .panelGreen { fill: #eef7ea; stroke: #6aa84f; stroke-width: 2.5; }
      .panelGrey { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.5; }
      .panelOrange { fill: #fff4e8; stroke: #d9903d; stroke-width: 2.5; }
      .panelPurple { fill: #f2ecfb; stroke: #8e6bbf; stroke-width: 2.5; }
      .panelRed { fill: #fff0f0; stroke: #c65353; stroke-width: 2.5; }
      .db { fill: #ffffff; stroke: #4e79a7; stroke-width: 2.5; }
      .boundary { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 7; }
      .line { stroke: #4e79a7; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .lineGreen { stroke: #6aa84f; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4e79a7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6aa84f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text x="800" y="54" text-anchor="middle" class="title">Unit-Test und Integrationstest</text>
  <text x="800" y="86" text-anchor="middle" class="subtitle">Integrationstests prüfen das Zusammenspiel mehrerer Schichten.</text>

  <text x="400" y="150" text-anchor="middle" class="section">Unit-Test</text>
  <g filter="url(#shadow)">
    <rect x="105" y="190" width="590" height="260" rx="20" class="boundary"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="170" y="285" width="170" height="80" rx="12" class="panelBlue"/>
    <rect x="455" y="285" width="180" height="80" rx="12" class="panelGreen"/>
  </g>
  <text x="255" y="318" text-anchor="middle" class="boxTitle">Test</text>
  <text x="255" y="344" text-anchor="middle" class="small">JUnit</text>
  <text x="545" y="318" text-anchor="middle" class="boxTitle">einzelne Klasse</text>
  <text x="545" y="344" text-anchor="middle" class="small">z.B. Service</text>
  <path d="M340 325 L455 325" class="line"/>
  <text x="400" y="410" text-anchor="middle" class="small">schnell, fokussiert, kleine Einheit</text>

  <text x="1060" y="150" text-anchor="middle" class="section">Integrationstest</text>
  <g filter="url(#shadow)">
    <rect x="770" y="190" width="720" height="400" rx="20" class="boundary"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="810" y="300" width="125" height="70" rx="12" class="panelBlue"/>
    <rect x="970" y="300" width="145" height="70" rx="12" class="panelBlue"/>
    <rect x="1150" y="300" width="140" height="70" rx="12" class="panelRed"/>
    <rect x="1325" y="300" width="135" height="70" rx="12" class="panelGreen"/>
    <rect x="1000" y="455" width="160" height="70" rx="12" class="panelGrey"/>
    <rect x="1220" y="455" width="190" height="70" rx="12" class="db"/>
  </g>
  <text x="872" y="328" text-anchor="middle" class="boxTitle">Test</text>
  <text x="872" y="351" text-anchor="middle" class="small">MockMvc</text>
  <text x="1042" y="328" text-anchor="middle" class="boxTitle">Controller</text>
  <text x="1042" y="351" text-anchor="middle" class="small">HTTP und JSON</text>
  <text x="1220" y="328" text-anchor="middle" class="boxTitle">Validation</text>
  <text x="1220" y="351" text-anchor="middle" class="small">Request prüfen</text>
  <text x="1392" y="328" text-anchor="middle" class="boxTitle">Service</text>
  <text x="1392" y="351" text-anchor="middle" class="small">Fachlogik</text>
  <text x="1080" y="483" text-anchor="middle" class="boxTitle">Repository</text>
  <text x="1080" y="506" text-anchor="middle" class="small">Datenzugriff</text>
  <text x="1315" y="483" text-anchor="middle" class="boxTitle">H2 Testdatenbank</text>
  <text x="1315" y="506" text-anchor="middle" class="small">kontrollierte Testdaten</text>
  <path d="M935 335 L970 335" class="lineGreen"/>
  <path d="M1115 335 L1150 335" class="lineGreen"/>
  <path d="M1290 335 L1325 335" class="lineGreen"/>
  <path d="M1392 370 C1392 425, 1250 455, 1160 490" class="lineGreen"/>
  <path d="M1160 490 L1220 490" class="lineGreen"/>

  <g filter="url(#shadow)">
    <rect x="210" y="720" width="1180" height="78" rx="18" fill="#fff6da" stroke="#d6a73b" stroke-width="2.5"/>
  </g>
  <text x="800" y="752" text-anchor="middle" class="note">Unit-Tests prüfen einzelne Klassen.</text>
  <text x="800" y="780" text-anchor="middle" class="note">Integrationstests prüfen Controller, Validation, Service, Repository und Datenbank gemeinsam.</text>
</svg>
